[project]
name = "quant-time-machine-backend"
version = "0.1.0"
description = "Backend API for Quant Time Machine: point-in-time data and backtesting."
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.6",
    "exchange-calendars>=4.13.2",
    "fastapi[standard]>=0.141.1",
    "httpx2>=2.13.1",
    "pandas>=3.0.6",
    "pydantic-settings>=2.15.0",
    "pytz>=2026.5",
    "supabase>=2.33.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

# Lets `uv run fastapi dev` find the app without extra arguments.
[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The backend is not installed as a package, so put this folder on the import path for tests.
pythonpath = ["."]
# Tests marked `network` call real APIs and need keys in backend/.env. They're skipped by
# default, so CI never runs them; run them with `uv run pytest -m network`.
addopts = "-m 'not network' --strict-markers"
markers = ["network: calls a real external API and needs keys in backend/.env"]

[tool.ruff]
# The storage benchmark runs on Python 3.12 (its embedded PostgreSQL has no 3.14 wheels),
# so lint and format it for 3.12 instead of the project's 3.14.
per-file-target-version = { "spikes/storage_benchmark.py" = "py312" }

[tool.ruff.lint]
# Ruff's defaults plus import sorting (I) and modern-syntax upgrades (UP); both are auto-fixable.
extend-select = ["I", "UP"]
