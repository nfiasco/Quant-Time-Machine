# Universe membership (S6.5): which securities were in each universe, and when.
#
# starter_large_caps is universe v1 (decision D3, doc/data-sources.md): large US
# companies, each a member from the effective date it joined the S&P 500 until the
# effective date it left, as S&P Dow Jones Indices announced them. It deliberately keeps
# companies that later left, so a backtest doesn't see only today's survivors.
#
# Each [[universes.members]] entry is one membership spell of a security in
# securities.toml. `added` is its first day as a member and `removed` the first day it
# wasn't one any more; `source` and `removed_source` cite them. S&P changes take effect
# before the open of a trading day, or after the close of the one before it, so both dates
# are the first session of the new membership. A company that left and rejoined has one
# entry per spell.
#
# History starts on 2010-01-01. A company already in the index then has
# added = 2010-01-01 and cites SPY's annual report, whose schedule of investments lists
# every S&P 500 member it held on September 30, 2009; each such member is also in SPY's
# holdings on March 31, 2010. Before 2010 the universe is empty. Sources were checked on
# 2026-10-31.

# Loaded with the members, but never one: SPY is the default benchmark (D3, S6.2).
benchmarks = ["spdr-sp500"]

[[universes]]
name = "starter_large_caps"

