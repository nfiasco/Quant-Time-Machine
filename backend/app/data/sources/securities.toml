source = "https://www.sec.gov/Archives/edgar/data/1418091/000087666122000890/ruleprovisionnotice.htm"

[[securities]]
id = "spdr-sp500"
share_class = "Trust units"
symbols = { tiingo = "SPY" }

# Called SPDR Trust, Series 1 until about 2010, per EDGAR's company record; the earlier
# name isn't modeled.
[[securities.history]]
from = 1993-01-29
ticker = "SPY"
name = "SPDR S&P 500 ETF Trust"
cik = 884394
# State Street, on EDGAR: SPY first traded on the AMEX on January 29, 1993.
source = "https://www.sec.gov/Archives/edgar/data/1222333/000119312513023294/d473476dfwp.htm"

