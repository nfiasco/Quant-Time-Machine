# Curated securities (S5.2): which security used which ticker, and when.
#
# SEC's ticker file (company_tickers.json) lists only today's tickers, so ticker history
# comes from here: every member of the universes in universes.toml (S6.5) and the M2
# ticker set (doc/data-sources.md), plus tickers that changed hands. FB became META, GOOG
# moved from Google's Class A shares to its Class C shares, and WB went from Wachovia to
# Weibo.
#
# Each [[securities.history]] entry applies from 00:00 ET on its date until the next
# entry, and cites the source of that date. `name` and `cik` carry over from the entry
# before when they don't change. `delisted = true` means the security stopped trading:
# from then on, no ticker resolves to it. A history starts when the security began
# trading, at its IPO, spin-off, or listing. For a company listed long before our price
# history, it starts on 2005-01-03 instead and cites a filing from then that names the
# ticker; earlier tickers aren't modeled. Sources were checked on 2026-10-22, and the
# universe members' on 2026-10-31.
#
# `id` is ours and never changes, even when the ticker, name, or CIK does. `symbols` are
# the codes each price vendor uses for the security's whole history: Tiingo files
# Facebook's history under META, for example.

# The M2 ticker set, with SPY as the benchmark: the test set that tests/fixtures/ and
# spikes/hosting.py use (D3). The ingesters load the universes' members instead
# (universes.toml).
m2_ticker_set = ["apple", "microsoft", "jpmorgan", "meta", "twitter", "spdr-sp500"]

[[securities]]
id = "apple"
share_class = "Common stock"
symbols = { tiingo = "AAPL" }

