name: Repository organization

on:
  workflow_run:
    workflows: [PR metadata request]
    types: [completed]
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to recheck (leave issue_number empty)
        type: string
      issue_number:
        description: Issue to categorize (leave pr_number empty)
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: organization-${{ github.event.workflow_run.pull_requests[0].number || github.event.issue.number || inputs.pr_number || inputs.issue_number || github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  organize:
    name: Organize metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only trusted default-branch code runs here. Never download PR code or artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Apply metadata and publish the PR metadata status
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/organize.py
