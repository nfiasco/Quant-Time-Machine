name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  organization-tests:
    name: Organization policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s .github/scripts -p "test_*.py"

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no major tags (no @v10), only immutable releases: pin the commit.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  # Railway builds backend/Dockerfile on each merge to main, once these jobs pass. Nobody
  # needs Docker locally, so this is where a broken image shows up before it ships.
  backend-image:
    name: Backend image (build + start)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag qtm-api backend
      - name: Start it with a PORT, as Railway does, and wait for /health
        run: |
          docker run --detach --name api --env PORT=9090 --publish 9090:9090 qtm-api
          for attempt in $(seq 30); do
            curl --fail --silent http://localhost:9090/health && break
            sleep 1
          done
          docker logs api
          curl --fail --silent --show-error http://localhost:9090/health
          # The server must not run as root (see the Dockerfile).
          test "$(docker exec api id -u)" != 0
